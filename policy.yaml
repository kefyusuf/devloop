version: 1
# Final fix wave (review Minor #1): mutation-testing gate'tir (spec R3) — advisory'den gates'e taşındı;
# authorizedSkips unchanged (stryker.config.json'suz repo'lar yetkili skip ile atlar).
gates: [risk-triage, static-gates, tests, secret-scan, mutation-testing]
advisory: [llm-ensemble]
authorizedSkips: [mutation-testing]   # A2: yalnız burada listelenen gate skip olabilir
maxFixTours: 3
maxIterations: 10
budgetUsd: 2.0
wallClockMinutes: 30
ensembleRiskThreshold: 40
mutationScoreThreshold: 60
mutationTimeoutMinutes: 15
l2MinDecisions: 100
l3MinGoldenTasks: 50
ciEnsembleRiskThreshold: 20
mutationScopeLow: 5
mutationScopeHigh: 10
sandbox: { mode: host, image: node:20-bookworm-slim }
risk:
  weights: { diffSize: 0.3, testDiff: 0.5, scopePaths: 0.2 }
llm:
  provider: anthropic
  crossProviderFallback: false   # R21 (faz 4 T6): true + diğer sağlayıcı anahtarı env'de mevcutsa → gateway zinciri cross-provider fallback kurar
  model: claude-sonnet-4-5
  fallbackModel: claude-haiku-3-5
  maxTokens: 8192
  backoffMs: 500
  costPer1kInput: 0.003
  costPer1kOutput: 0.015
  openai:
    model: gpt-4.1
    fallbackModel: gpt-4.1-mini
    maxTokens: 8192
    costPer1kInput: 0.0025
    costPer1kOutput: 0.01
